[project]
name = "text2sql-agent"
version = "0.2.0"
description = "SSB Admin Text-to-SQL chatbot — LangChain + Claude + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.7",
    "langchain-groq>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langgraph>=1.0.6",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "flask>=3.0.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
]

[project.urls]
Repository = "https://github.com/kevinbfrank/text-to-sql-agent"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
