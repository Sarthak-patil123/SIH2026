version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: sih_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sih_db
      AI_SERVICE_URL: http://ai-services:8000
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: sih_ai_services
    restart: always
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
